name: Education iOS validation and TestFlight
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact approved 40-character commit in the private Education repository
        required: true
        type: string
        default: 96eb003c3215993629733c1c1668bfb6d6a1cc89
      operation:
        description: Validate native iOS only, or sign and upload after all tests pass
        type: choice
        required: true
        default: validate
        options: [validate, testflight]
permissions:
  contents: read
concurrency:
  group: education-public-ios-build
  cancel-in-progress: false
jobs:
  native:
    if: github.actor == 'centerdata58-lang' && github.triggering_actor == 'centerdata58-lang' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 100
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check source permission and requested operation before expensive work
        id: configuration
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          OPERATION: ${{ inputs.operation }}
          SOURCE_SSH: ${{ secrets.EDUCATION_SOURCE_SSH_KEY }}
          SOURCE_TOKEN: ${{ secrets.EDUCATION_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'STOP: full source commit required'; exit 64; }
          case "$OPERATION" in validate|testflight) ;; *) exit 64;; esac
          if [[ -n "$SOURCE_SSH" ]]; then
            echo 'method=ssh' >> "$GITHUB_OUTPUT"
          elif [[ -n "$SOURCE_TOKEN" ]]; then
            echo 'method=token' >> "$GITHUB_OUTPUT"
          else
            echo 'STOP: read-only private-source access must be configured by the owner.'
            exit 78
          fi
      - name: Check signing settings for an explicitly requested upload
        if: inputs.operation == 'testflight'
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 ASC_PRIVATE_KEY ASC_KEY_ID ASC_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then echo "STOP: missing signing secret $name"; exit 78; fi
          done
      - name: Checkout public orchestration at the dispatched revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: orchestration
          ref: ${{ github.sha }}
          persist-credentials: false
          show-progress: false
      - name: Read approved private source with scoped deploy key
        if: steps.configuration.outputs.method == 'ssh'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: centerdata58-lang/datagram-education
          ref: ${{ inputs.source_sha }}
          path: source
          ssh-key: ${{ secrets.EDUCATION_SOURCE_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Read approved private source with repository-limited read token
        if: steps.configuration.outputs.method == 'token'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: centerdata58-lang/datagram-education
          ref: ${{ inputs.source_sha }}
          path: source
          token: ${{ secrets.EDUCATION_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Verify exact source commit
        working-directory: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Configure Flutter without public application caches
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: false
      - name: Configure Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate actual application before allowing signing
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_logs="$RUNNER_TEMP/education-private-results"
          mkdir -p "$private_logs"
          stage() {
            label="$1"; shift
            if "$@" > "$private_logs/$label.log" 2>&1; then
              printf 'PASS: %s\n' "$label"
            else
              code=$?
              printf 'STOP: %s failed (exit %s); private output was not published.\n' "$label" "$code"
              exit "$code"
            fi
          }
          stage identity python3 ops/ios/check_identity.py
          stage dependencies flutter pub get --enforce-lockfile
          stage backend bash -c 'node --test backend/test/*.test.mjs'
          stage analysis flutter analyze
          stage flutter-tests flutter test
          stage iphone-ipad-native bash ops/ios/validate_native.sh
          printf 'Native iPhone/iPad tests passed. No signing has happened at this step.\n'
      - name: Compile unsigned device release for validation-only runs
        if: inputs.operation == 'validate'
        working-directory: source
        run: |
          set -euo pipefail
          if flutter build ios --release --no-codesign > "$RUNNER_TEMP/education-private-results/device.log" 2>&1; then
            echo 'PASS: device release compilation. This is not a signed IPA or a TestFlight upload.'
          else
            echo 'STOP: device release compilation failed.'
            exit 1
          fi
      - name: Sign existing Education identity and upload internal TestFlight IPA
        if: inputs.operation == 'testflight'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 orchestration/ops/sign_publish.py --source source
      - name: Remove private checkout and private logs from the disposable runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_WORKSPACE:-}" != ''
          test "${RUNNER_TEMP:-}" != ''
          rm -rf -- "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/education-private-results"
